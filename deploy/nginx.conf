upstream indi_allsky_app {
    server gunicorn.indi.allsky:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 1024m;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"yanoastro-allsky-web"}\n';
    }

    location = / {
        return 302 /indi-allsky/;
    }

    location /indi-allsky/images/ {
        alias /var/www/html/allsky/images/;
        autoindex off;
        expires 14d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /indi-allsky/static/ {
        alias /srv/indi-allsky/static/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /indi-allsky {
        proxy_pass http://indi_allsky_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_redirect off;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
